<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RDESK VAULT // WEB3</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg-dark: #0a0a0f;
      --glass-bg: rgba(20, 20, 25, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --cyan: #00f3ff;
      --pink: #ff007f;
      --dichroic: linear-gradient(135deg, var(--cyan), var(--pink));
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --danger: #ef4444;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 15% 50%, rgba(0, 243, 255, 0.05), transparent 25%),
                        radial-gradient(circle at 85% 30%, rgba(255, 0, 127, 0.05), transparent 25%);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      margin: 0; padding: 20px;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }

    .app-card {
      width: 100%; max-width: 420px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
      display: flex; flex-direction: column; gap: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 10px;
    }

    .header h1 {
      font-size: 1.4rem; font-weight: 700; margin: 0;
      background: var(--dichroic);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    .header p { color: var(--text-muted); font-size: 0.85rem; margin: 5px 0 0 0; }

    input, textarea, select {
      width: 100%; padding: 14px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      border-radius: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem; box-sizing: border-box; transition: all 0.3s ease;
    }

    input:focus, textarea:focus, select:focus {
      outline: none; border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(0, 243, 255, 0.15);
    }

    textarea { resize: none; height: 100px; line-height: 1.5; }

    button {
      width: 100%; padding: 16px;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 0.95rem;
      cursor: pointer; border-radius: 12px; border: none;
      transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .btn-primary {
      background: var(--dichroic); color: #fff;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.2);
    }
    .btn-primary:hover { filter: brightness(1.15); transform: translateY(-1px); }

    .btn-secondary {
      background: transparent; color: var(--text-main);
      border: 1px solid var(--glass-border);
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.05); }

    .balances {
      display: flex; gap: 15px;
    }
    
    .asset-box {
      flex: 1; background: rgba(0,0,0,0.2);
      border: 1px solid var(--glass-border); border-radius: 16px;
      padding: 15px; text-align: center;
    }
    
    .asset-name { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; }
    .asset-value { font-family: 'JetBrains Mono', monospace; font-size: 1.4rem; font-weight: 700; margin-top: 5px; }
    
    .val-celo { color: var(--text-main); }
    .val-usdt { color: #26a17b; }

    .qr-container {
      background: #fff; padding: 15px; border-radius: 16px;
      display: flex; justify-content: center; margin: 0 auto; width: fit-content;
    }

    .address-pill {
      background: rgba(0, 243, 255, 0.1); border: 1px solid rgba(0, 243, 255, 0.2);
      color: var(--cyan); padding: 10px; border-radius: 8px;
      font-family: 'JetBrains Mono', monospace; font-size: 0.8rem;
      text-align: center; word-break: break-all; margin-top: 15px;
    }

    .card-section {
      background: rgba(0,0,0,0.15); border: 1px solid var(--glass-border);
      border-radius: 16px; padding: 20px;
    }

    .section-title {
      font-size: 0.8rem; color: var(--text-muted); font-weight: 700;
      margin-bottom: 15px; display: flex; align-items: center; gap: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <h1>RDESK VAULT</h1>
    <p>Decentralized Celo OS</p>
  </div>

  <!-- TELA INICIAL: ESCOLHA DE ROTA -->
  <div id="view-start" class="hidden">
    <p style="text-align:center; color:var(--text-muted); font-size:0.9rem; margin-bottom:20px;">Nenhum cofre detectado neste dispositivo.</p>
    <button class="btn-primary" style="margin-bottom: 12px;" onclick="showView('view-create')">Criar Nova Carteira</button>
    <button class="btn-secondary" onclick="showView('view-restore')">Restaurar 12 Palavras</button>
  </div>

  <!-- TELA: CRIAR CARTEIRA -->
  <div id="view-create" class="hidden">
    <div class="section-title">GERAR NOVO COFRE</div>
    <input type="password" id="pin-create" placeholder="Crie um PIN (Mín. 4 dígitos)">
    <button class="btn-primary" style="margin-top:10px;" onclick="createNewWallet()">Gerar e Encriptar</button>
    <button class="btn-secondary" style="margin-top:10px;" onclick="showView('view-start')">Voltar</button>
  </div>

  <!-- TELA: RESTAURAR CARTEIRA -->
  <div id="view-restore" class="hidden">
    <div class="section-title">RESTAURAR COFRE EXISTENTE</div>
    <textarea id="mnemonic-input" placeholder="Cole aqui suas 12 palavras separadas por espaço..."></textarea>
    <input type="password" id="pin-restore" placeholder="Crie um PIN para este dispositivo">
    <button class="btn-primary" style="margin-top:10px;" onclick="restoreWallet()">Restaurar Acesso</button>
    <button class="btn-secondary" style="margin-top:10px;" onclick="showView('view-start')">Voltar</button>
  </div>

  <!-- TELA: DESBLOQUEAR -->
  <div id="view-unlock" class="hidden">
    <div class="section-title" style="justify-content:center;">DESBLOQUEAR COFRE LOCAL</div>
    <input type="password" id="pin-unlock" placeholder="Digite seu PIN">
    <button class="btn-primary" style="margin-top:10px;" onclick="unlockWallet()">Acessar</button>
    <button class="btn-secondary" style="margin-top:10px; color:var(--danger); border-color:rgba(239, 68, 68, 0.3);" onclick="nukeVault()">Destruir Cofre (Sair)</button>
  </div>

  <!-- TELA: DASHBOARD PRINCIPAL -->
  <div id="view-dashboard" class="hidden">
    
    <div class="balances">
      <div class="asset-box">
        <div class="asset-name">CELO</div>
        <div class="asset-value val-celo" id="bal-celo">...</div>
      </div>
      <div class="asset-box">
        <div class="asset-name">USDT</div>
        <div class="asset-value val-usdt" id="bal-usdt">...</div>
      </div>
    </div>
    <button class="btn-secondary" onclick="updateBalances()" style="padding: 10px; font-size:0.8rem; margin-bottom: 10px;">Atualizar Saldos</button>

    <!-- RECEBER -->
    <div class="card-section">
      <div class="section-title">✦ RECEBER</div>
      <div class="qr-container" id="qrcode"></div>
      <div class="address-pill" id="wallet-address">0x...</div>
    </div>

    <!-- ENVIAR -->
    <div class="card-section">
      <div class="section-title">✦ TRANSFERIR</div>
      <select id="tx-asset" style="margin-bottom: 10px;">
        <option value="celo">Ativo: CELO Nativo</option>
        <option value="usdt">Ativo: USDT (Rede Celo)</option>
      </select>
      <input type="text" id="tx-to" placeholder="Endereço (0x...)" style="margin-bottom: 10px;">
      <input type="number" id="tx-amount" placeholder="Quantia" step="any" style="margin-bottom: 15px;">
      <button class="btn-primary" onclick="sendTransaction()" id="btn-send">Assinar e Enviar</button>
    </div>

    <button class="btn-secondary" style="margin-top:10px;" onclick="location.reload()">Travar Cofre (Lock)</button>
  </div>

</div>

<script>
  // --- CONFIGURAÇÃO WEB3 E CONTRATOS ---
  const provider = new ethers.JsonRpcProvider("https://forno.celo.org");
  let activeWallet = null;

  const USDT_ADDRESS = "0x48065fbBE25f71C9282ddf5e1cD6D6A8824272d4";
  const ERC20_ABI = ["function balanceOf(address) view returns (uint256)", "function decimals() view returns (uint8)", "function transfer(address, uint) returns (bool)"];

  // --- CRIPTOGRAFIA AES-GCM ---
  const cryptoAPI = window.crypto;
  async function getDerivationKey(pin, salt) {
    const enc = new TextEncoder();
    const keyMat = await cryptoAPI.subtle.importKey("raw", enc.encode(pin), {name: "PBKDF2"}, false, ["deriveKey"]);
    return cryptoAPI.subtle.deriveKey(
      {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
      keyMat, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]
    );
  }
  async function encryptData(text, pin) {
    const salt = cryptoAPI.getRandomValues(new Uint8Array(16)), iv = cryptoAPI.getRandomValues(new Uint8Array(12));
    const key = await getDerivationKey(pin, salt);
    const cipher = await cryptoAPI.subtle.encrypt({name: "AES-GCM", iv: iv}, key, new TextEncoder().encode(text));
    return JSON.stringify({ salt: Array.from(salt), iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) });
  }
  async function decryptData(payload, pin) {
    const data = JSON.parse(payload), key = await getDerivationKey(pin, new Uint8Array(data.salt));
    const decrypted = await cryptoAPI.subtle.decrypt({name: "AES-GCM", iv: new Uint8Array(data.iv)}, key,
