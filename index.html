<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOT VAULT // MULTI-ASSET CELO</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  
  <style>
    :root {
      --bg: #050505; --card: #0a0a0c;
      --matrix: #00ff66; --matrix-dim: rgba(0, 255, 102, 0.2);
      --cyan: #00f3ff; --alert: #ff3333; --usdt: #26a17b;
    }
    body {
      background: var(--bg); color: #ccc; font-family: 'Courier New', monospace;
      margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh;
    }
    .terminal {
      width: 100%; max-width: 450px; background: var(--card);
      border: 1px solid var(--matrix); border-radius: 4px; padding: 20px;
      box-shadow: 0 0 15px var(--matrix-dim); display: flex; flex-direction: column; gap: 15px;
    }
    .header {
      color: var(--matrix); font-size: 1.2rem; font-weight: bold; text-align: center; 
      text-shadow: 0 0 5px var(--matrix); letter-spacing: 2px; border-bottom: 1px dashed #333; padding-bottom: 10px;
    }
    input, select {
      width: 100%; padding: 12px; background: #000; border: 1px solid #333; color: var(--cyan);
      font-family: inherit; font-size: 1rem; box-sizing: border-box; text-align: center; margin-bottom: 10px;
      appearance: none;
    }
    input:focus, select:focus { outline: none; border-color: var(--matrix); }
    button {
      width: 100%; padding: 15px; font-family: inherit; font-weight: bold; cursor: pointer;
      background: #111; color: var(--matrix); border: 1px solid var(--matrix); transition: 0.2s; text-transform: uppercase;
    }
    button:hover { background: var(--matrix); color: #000; }
    .btn-action { background: linear-gradient(90deg, var(--matrix), var(--cyan)); color: #000; border: none; }
    .btn-action:hover { filter: brightness(1.2); }
    .data-box { background: #000; padding: 12px; border: 1px solid #333; word-break: break-all; color: var(--cyan); font-size: 0.85rem; text-align: center;}
    
    /* Layout de Saldos */
    .balances { display: flex; justify-content: space-around; margin: 10px 0; }
    .asset-box { text-align: center; }
    .asset-name { font-size: 0.8rem; color: #888; }
    .asset-value { font-size: 1.6rem; font-weight: bold; }
    .val-celo { color: var(--matrix); text-shadow: 0 0 8px var(--matrix-dim); }
    .val-usdt { color: var(--usdt); text-shadow: 0 0 8px rgba(38, 161, 123, 0.4); }

    .hidden { display: none !important; }
    #qrcode { display: flex; justify-content: center; margin: 15px 0; padding: 10px; background: #fff; border-radius: 4px; }
  </style>
</head>
<body>

<div class="terminal">
  <div class="header">SYS // ROOT_VAULT</div>

  <!-- SETUP E DESBLOQUEIO -->
  <div id="view-auth">
    <div id="auth-msg" style="text-align:center; color:#888; margin-bottom:15px;"></div>
    <input type="password" id="pin-input" placeholder="DIGITE O PIN (MÍN. 4 DÍGITOS)">
    <button class="btn-action" onclick="authenticate()">[ EXECUTAR ]</button>
  </div>

  <!-- PAINEL OPERACIONAL -->
  <div id="view-dashboard" class="hidden">
    
    <div class="balances">
      <div class="asset-box">
        <div class="asset-name">CELO</div>
        <div class="asset-value val-celo" id="bal-celo">0.000</div>
      </div>
      <div class="asset-box">
        <div class="asset-name">USDT</div>
        <div class="asset-value val-usdt" id="bal-usdt">0.00</div>
      </div>
    </div>
    <button onclick="updateBalances()" style="padding: 8px; margin-bottom:15px; font-size:0.8rem;">[ ATUALIZAR SALDOS ]</button>

    <div style="border:1px dashed #333; padding:15px; margin-bottom:15px;">
      <div style="text-align:center; color:var(--cyan);">> ENDEREÇO DE RECEBIMENTO</div>
      <div style="text-align:center; font-size:0.7rem; color:#888;">(Aceita CELO e USDT na rede Celo)</div>
      <div id="qrcode"></div>
      <div class="data-box" id="wallet-address">0x...</div>
    </div>

    <div style="border:1px dashed #333; padding:15px; margin-bottom:15px;">
      <div style="text-align:center; color:var(--alert); margin-bottom:10px;">> TRANSMITIR ATIVO</div>
      
      <select id="tx-asset">
        <option value="celo">Mudar ativo: CELO</option>
        <option value="usdt">Mudar ativo: USDT (Celo Network)</option>
      </select>

      <input type="text" id="tx-to" placeholder="Endereço Destino (0x...)">
      <input type="number" id="tx-amount" placeholder="Quantia (ex: 5.50)" step="any">
      <button class="btn-action" onclick="sendTransaction()" id="btn-send">[ ASSINAR E ENVIAR ]</button>
    </div>

    <button style="border-color:var(--alert); color:var(--alert);" onclick="location.reload()">[ TRAVAR COFRE ]</button>
  </div>
</div>

<script>
  // --- CONFIGURAÇÃO WEB3 E CONTRATOS ---
  const provider = new ethers.JsonRpcProvider("https://forno.celo.org");
  let activeWallet = null;

  // Endereço e ABI mínimos do USDT na Celo
  const USDT_ADDRESS = "0x48065fbBE25f71C9282ddf5e1cD6D6A8824272d4";
  const ERC20_ABI = [
    "function balanceOf(address owner) view returns (uint256)",
    "function decimals() view returns (uint8)",
    "function transfer(address to, uint amount) returns (bool)"
  ];

  // --- MOTOR CRIPTOGRÁFICO AES-GCM ---
  const cryptoAPI = window.crypto;
  async function getDerivationKey(pin, salt) {
    const enc = new TextEncoder();
    const keyMat = await cryptoAPI.subtle.importKey("raw", enc.encode(pin), {name: "PBKDF2"}, false, ["deriveKey"]);
    return cryptoAPI.subtle.deriveKey(
      {name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256"},
      keyMat, {name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]
    );
  }
  async function encryptData(text, pin) {
    const salt = cryptoAPI.getRandomValues(new Uint8Array(16)), iv = cryptoAPI.getRandomValues(new Uint8Array(12));
    const key = await getDerivationKey(pin, salt);
    const cipher = await cryptoAPI.subtle.encrypt({name: "AES-GCM", iv: iv}, key, new TextEncoder().encode(text));
    return JSON.stringify({ salt: Array.from(salt), iv: Array.from(iv), cipher: Array.from(new Uint8Array(cipher)) });
  }
  async function decryptData(payload, pin) {
    const data = JSON.parse(payload), key = await getDerivationKey(pin, new Uint8Array(data.salt));
    const decrypted = await cryptoAPI.subtle.decrypt({name: "AES-GCM", iv: new Uint8Array(data.iv)}, key, new Uint8Array(data.cipher));
    return new TextDecoder().decode(decrypted);
  }

  // --- LÓGICA DE INTERFACE ---
  window.onload = () => {
    const msg = document.getElementById('auth-msg');
    msg.innerText = localStorage.getItem('root_key') ? "> COFRE DETECTADO. INSIRA O PIN PARA ABRIR." : "> NOVO DISPOSITIVO. CRIE UM PIN PARA GERAR CHAVES.";
  };

  async function authenticate() {
    const pin = document.getElementById('pin-input').value;
    if (pin.length < 4) return alert("PIN curto demais.");
    
    const vault = localStorage.getItem('root_key');
    
    try {
      if (!vault) {
        const wallet = ethers.Wallet.createRandom();
        localStorage.setItem('root_key', await encryptData(wallet.privateKey, pin));
        alert("CRÍTICO: Anote estas 12 palavras. Se perder, perde o dinheiro:\n\n" + wallet.mnemonic.phrase);
        activeWallet = wallet.connect(provider);
      } else {
        const privKey = await decryptData(vault, pin);
        activeWallet = new ethers.Wallet(privKey, provider);
      }
      loadDashboard();
    } catch(e) {
      alert("Erro Crítico: PIN incorreto ou dados corrompidos.");
    }
  }

  function loadDashboard() {
    document.getElementById('view-auth').classList.add('hidden');
    document.getElementById('view-dashboard').classList.remove('hidden');
    
    const address = activeWallet.address;
    document.getElementById('wallet-address').innerText = address;
    
    document.getElementById('qrcode').innerHTML = "";
    new QRCode(document.getElementById("qrcode"), {
      text: address, width: 130, height: 130,
      colorDark: "#000000", colorLight: "#ffffff", correctLevel: QRCode.CorrectLevel.M
    });

    updateBalances();
  }

  // --- FUNÇÕES BLOCKCHAIN MULTI-ASSET ---
  async function updateBalances() {
    try {
      document.getElementById('bal-celo').innerText = "...";
      document.getElementById('bal-usdt').innerText = "...";

      // LER CELO NATIVO (18 decimais)
      const balanceWei = await provider.getBalance(activeWallet.address);
      document.getElementById('bal-celo').innerText = parseFloat(ethers.formatEther(balanceWei)).toFixed(4);

      // LER USDT (Contrato ERC-20)
      const usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, provider);
      const usdtRaw = await usdtContract.balanceOf(activeWallet.address);
      const usdtDecimals = await usdtContract.decimals(); // USDT costuma usar 6 decimais, não 18
      document.getElementById('bal-usdt').innerText = parseFloat(ethers.formatUnits(usdtRaw, usdtDecimals)).toFixed(2);

    } catch (e) {
      document.getElementById('bal-celo').innerText = "ERR";
      document.getElementById('bal-usdt').innerText = "ERR";
    }
  }

  async function sendTransaction() {
    const btn = document.getElementById('btn-send');
    const asset = document.getElementById('tx-asset').value;
    const to = document.getElementById('tx-to').value.trim();
    const amount = document.getElementById('tx-amount').value;

    if (!ethers.isAddress(to) || !amount || amount <= 0) return alert("Endereço ou quantia inválidos.");

    try {
      btn.innerText = "[ ASSINANDO... ]";
      let tx;

      if (asset === 'celo') {
        // Envio de CELO Nativo
        tx = await activeWallet.sendTransaction({
          to: to,
          value: ethers.parseEther(amount.toString())
        });
      } else {
        // Envio de USDT ERC-20 (Interação com Smart Contract)
        const usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, activeWallet);
        const decimals = await usdtContract.decimals();
        const parsedAmount = ethers.parseUnits(amount.toString(), decimals);
        
        // A chamada "transfer" gera a transação na rede
        tx = await usdtContract.transfer(to, parsedAmount);
      }
      
      btn.innerText = "[ TRANSMITIDO. AGUARDE... ]";
      await tx.wait(); // Aguarda mineração
      
      alert("Sucesso! Transação confirmada no bloco.");
      document.getElementById('tx-amount').value = '';
      updateBalances();
    } catch (e) {
      console.error(e);
      alert("Falha: " + (e.reason || e.message));
    } finally {
      btn.innerText = "[ ASSINAR E ENVIAR ]";
    }
  }
</script>

</body>
</html>
